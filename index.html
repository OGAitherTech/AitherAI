<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aither AI chat"><title>Aither AI 🤖</title><link rel="stylesheet" href="./style.css"></head><body><div class="app"><aside id="sidebar"><div class="side-head"><div class="logo">A</div><div><b>Aither AI</b><small>Your AI assistant</small></div></div><button id="newSide" class="new-chat">＋ New chat</button><div class="side-label">CHATS</div><div id="history"></div><div class="side-foot">🤖 <b>Aither AI</b><small>Hosted AI</small></div></aside><section class="shell"><header><button id="menu" class="icon mobile">☰</button><div class="brand"><div class="logo">A</div><div><b>Aither AI</b><span><i></i> Online</span></div></div><div class="actions"><button id="key" class="icon">🔑</button><button id="new" class="new-top">＋ New chat</button></div></header><main id="chat"><section id="welcome"><div class="orb">A</div><h1>Hi! I'm Aither AI</h1><p>My name is <b>Aither AI</b>. What can I help you with?</p><div class="chips"><button data-p="Tell me a fun fact">💡 Fun fact</button><button data-p="Tell me a joke">😂 Tell me a joke</button><button data-p="Give me a coding idea">💻 Coding idea</button><button data-p="Help me brainstorm something">✨ Brainstorm</button></div></section></main><form id="form"><div class="box"><textarea id="input" rows="1" placeholder="Message Aither AI..."></textarea><button class="send">➤</button></div><div class="hint">Aither AI • Hosted by OpenRouter</div></form></section></div><script>const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),welcome=$('welcome'),form=$('form'),history=$('history');let messages=[],chats=JSON.parse(localStorage.getItem('aither_chats')||'[]');const MODEL='openrouter/free';function save(){localStorage.setItem('aither_chats',JSON.stringify(chats))}function add(role,text){let r=document.createElement('div');r.className='msg '+role;r.innerHTML='<div class="avatar">'+(role==='user'?'🙂':'A')+'</div><div><div class="sender">'+(role==='user'?'You':'Aither AI')+'</div><div class="bubble"></div></div>';r.querySelector('.bubble').textContent=text;chat.append(r);chat.scrollTop=chat.scrollHeight}function renderHistory(){history.innerHTML='';chats.forEach((c,i)=>{let b=document.createElement('button');b.className='history-item';b.textContent='💬 '+c.title;b.onclick=()=>{messages=c.messages||[];welcome.style.display='none';chat.querySelectorAll('.msg').forEach(x=>x.remove());messages.forEach(m=>add(m.role,m.content))};history.append(b)})}function askKey(){let k=prompt('Paste your OpenRouter API key. It is stored only in this browser session.');if(k?.trim())sessionStorage.setItem('aither_key',k.trim())}async function send(text){text=text.trim();if(!text)return;let k=sessionStorage.getItem('aither_key')||'';if(!k){askKey();k=sessionStorage.getItem('aither_key')||'';if(!k)return}welcome.style.display='none';add('user',text);messages.push({role:'user',content:text});input.value='';let load=document.createElement('div');load.className='msg assistant';load.innerHTML='<div class="avatar">A</div><div><div class="sender">Aither AI</div><div class="bubble">Thinking…</div></div>';chat.append(load);chat.scrollTop=chat.scrollHeight;try{let res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Aither AI'},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'Your name is Aither AI. Always identify yourself as Aither AI when asked your name. You are a helpful, friendly conversational AI assistant.'},...messages]})});let d=await res.json();if(!res.ok)throw Error(d?.error?.message||'AI request failed');let reply=d?.choices?.[0]?.message?.content||'No response.';load.remove();add('assistant',reply);messages.push({role:'assistant',content:reply});chats[0]={title:messages[0].content.slice(0,35),messages};save();renderHistory()}catch(e){load.remove();add('assistant','⚠️ '+e.message)}}form.onsubmit=e=>{e.preventDefault();send(input.value)};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};$('key').onclick=askKey;$('new').onclick=$('newSide').onclick=()=>{messages=[];chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display='flex';input.focus()};$('menu').onclick=()=>document.body.classList.toggle('side-open');document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.dataset.p));renderHistory();input.focus();</script></body></html>
