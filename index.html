<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aither AI — a fast, simple AI chat"><meta name="theme-color" content="#080a10"><title>Aither AI</title><link rel="stylesheet" href="./style.css"></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="side-top"><div class="side-brand"><div class="logo">A</div><div><b>Aither AI</b></div></div></div><button id="newSide" class="new-chat">＋ New chat</button><div class="history-label">CHATS</div><div class="history" id="history"></div><div class="side-bottom">🤖 <b>Aither AI</b><small>AI chat • Your conversations stay in this browser</small></div></aside><section class="shell"><header><button id="menu" class="icon mobile-only" aria-label="Open menu">☰</button><div class="brand"><div class="logo">A</div><div><b>Aither AI</b><span><i></i> Ready</span></div></div><div class="actions"><button id="key" class="icon" aria-label="Set OpenRouter API key" title="API key">🔑</button><button id="new" class="new-top">＋ New chat</button></div></header><main id="chat"><section id="welcome"><div class="orb">A</div><h1>Hi! I'm Aither AI</h1><p>Ask me anything. I can answer questions, brainstorm ideas, explain things, and help with code.</p><div class="chips"><button data-p="Tell me a fun fact">💡 Fun fact</button><button data-p="Tell me a joke">😂 Tell me a joke</button><button data-p="Give me a coding idea">💻 Coding idea</button><button data-p="Help me brainstorm something">✨ Brainstorm</button></div></section></main><form id="composer"><div class="composer-box"><textarea id="input" rows="1" maxlength="12000" placeholder="Message Aither AI..." aria-label="Message Aither AI"></textarea><div class="composer-actions"><button class="send" id="send" type="submit" aria-label="Send">➤</button></div></div><div class="composer-note">Aither AI • Hosted by OpenRouter • <span id="status">Ready</span></div></form></section></div><script>const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),welcome=$('welcome'),form=$('composer'),history=$('history'),status=$('status'),sendBtn=$('send');let messages=[],chats=JSON.parse(localStorage.getItem('aither_chats')||'[]'),currentId=null;const MODEL='openrouter/free';function save(){localStorage.setItem('aither_chats',JSON.stringify(chats))}function add(role,text){const r=document.createElement('div');r.className='msg '+role;r.innerHTML='<div class="avatar">'+(role==='user'?'🙂':'A')+'</div><div class="message-wrap"><div class="sender">'+(role==='user'?'You':'Aither AI')+'</div><div class="bubble"></div></div>';r.querySelector('.bubble').textContent=text;chat.append(r);chat.scrollTop=chat.scrollHeight;return r}function renderHistory(){history.innerHTML='';chats.slice().reverse().forEach(c=>{const b=document.createElement('button');b.className='history-item'+(c.id===currentId?' active':'');b.textContent='💬 '+c.title;b.onclick=()=>loadChat(c.id);history.append(b)})}function loadChat(id){const c=chats.find(x=>x.id===id);if(!c)return;currentId=id;messages=c.messages||[];chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display=messages.length?'none':'flex';messages.forEach(m=>add(m.role,m.content));renderHistory();document.body.classList.remove('side-open');input.focus()}function newChat(){currentId=null;messages=[];chat.querySelectorAll('.msg').forEach(x=>x.remove());welcome.style.display='flex';input.value='';input.style.height='auto';status.textContent='Ready';renderHistory();document.body.classList.remove('side-open');input.focus()}function askKey(){const old=sessionStorage.getItem('aither_key')||'';const k=prompt(old?'Update your OpenRouter API key.':'Paste your OpenRouter API key. It is stored only in this browser session.');if(k!==null&&k.trim())sessionStorage.setItem('aither_key',k.trim())}function setBusy(v){input.disabled=v;sendBtn.disabled=v;status.textContent=v?'Thinking…':'Ready'}async function send(text){text=text.trim();if(!text||input.disabled)return;let k=sessionStorage.getItem('aither_key')||'';if(!k){askKey();k=sessionStorage.getItem('aither_key')||'';if(!k)return}welcome.style.display='none';add('user',text);messages.push({role:'user',content:text});input.value='';input.style.height='auto';setBusy(true);const load=add('assistant','Thinking…');try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Aither AI'},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'Your name is Aither AI. Be helpful, clear, friendly, and conversational. Answer the user directly. Use concise formatting unless detail is useful.'},...messages]})});let d;try{d=await res.json()}catch{throw Error('The AI service returned an invalid response.')}if(!res.ok)throw Error(d?.error?.message||('AI request failed ('+res.status+')'));const reply=d?.choices?.[0]?.message?.content?.trim();if(!reply)throw Error('Aither AI returned an empty response.');load.remove();add('assistant',reply);messages.push({role:'assistant',content:reply});if(!currentId)currentId=crypto.randomUUID?crypto.randomUUID():String(Date.now());const title=messages.find(m=>m.role==='user')?.content?.slice(0,45)||'New chat';const saved={id:currentId,title,messages};chats=chats.filter(c=>c.id!==currentId);chats.push(saved);if(chats.length>30)chats=chats.slice(-30);save();renderHistory()}catch(e){load.remove();add('assistant','I couldn’t get a response. '+e.message);status.textContent='Error'}finally{input.disabled=false;sendBtn.disabled=false;if(status.textContent==='Thinking…')status.textContent='Ready';input.focus()}}form.onsubmit=e=>{e.preventDefault();send(input.value)};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,170)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};$('key').onclick=askKey;$('new').onclick=newChat;$('newSide').onclick=newChat;$('menu').onclick=()=>document.body.classList.toggle('side-open');document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.dataset.p));renderHistory();input.focus();</script></body></html>
