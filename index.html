<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aither AI chat"><title>Aither AI 🤖</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d12;color:#f5f7fb;height:100vh}#app{height:100vh;display:flex;flex-direction:column}header{height:64px;border-bottom:1px solid #242833;display:flex;align-items:center;padding:0 18px;gap:12px;background:#10131a}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;color:#111;font-weight:900;font-size:21px}.brand{font-weight:800;font-size:18px}.status{font-size:12px;color:#8e96a8;margin-left:6px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35d07f;margin-right:5px}.spacer{flex:1}button{border:0;cursor:pointer}.new{background:#fff;color:#111;border-radius:10px;padding:10px 14px;font-weight:700}.chat{flex:1;overflow:auto;padding:30px 18px 130px;max-width:900px;width:100%;margin:auto}.welcome{text-align:center;margin:10vh auto 0;max-width:650px}.orb{width:72px;height:72px;margin:auto;border-radius:22px;background:#fff;color:#111;display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:0 12px 50px #0006}.welcome h1{font-size:32px;margin:22px 0 8px}.welcome p{color:#9ba3b5}.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}.chips button{padding:11px 15px;border:1px solid #2b303c;background:#151923;color:#e9edf5;border-radius:12px}.msg{display:flex;gap:12px;margin:24px 0}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:#202532;font-weight:800}.msg.user .avatar{background:#fff;color:#111}.message-wrap{max-width:calc(100% - 48px)}.sender{font-size:12px;color:#8f97a8;margin:2px 0 6px}.bubble{white-space:pre-wrap;line-height:1.55;background:#151923;border:1px solid #252b38;border-radius:4px 16px 16px 16px;padding:12px 15px}.user .bubble{background:#202531;border-radius:16px 4px 16px 16px}.composer{position:fixed;bottom:0;left:0;right:0;padding:16px 18px 10px;background:linear-gradient(transparent,#0b0d12 25%)}form>div{max-width:850px;margin:auto}.box{display:flex;align-items:end;gap:8px;background:#151923;border:1px solid #343a48;border-radius:18px;padding:8px 8px 8px 15px;box-shadow:0 10px 40px #0005}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:#fff;font:inherit;min-height:28px;max-height:150px;padding:8px 0}.send{width:42px;height:42px;border-radius:13px;background:#fff;color:#111;font-size:20px;font-weight:900}.hint{text-align:center;color:#697184;font-size:11px;margin-top:7px}.key{background:transparent;color:#9ba3b5;padding:8px;font-size:18px}@media(max-width:600px){header{padding:0 12px}.status{display:none}.chat{padding-left:12px;padding-right:12px}.welcome{margin-top:8vh}.welcome h1{font-size:26px}.new{font-size:0;padding:10px}.new:after{content:'＋';font-size:20px}}
</style></head><body><div id="app"><header><div class="logo">A</div><div class="brand">Aither AI <span class="status"><span class="dot"></span>Online</span></div><div class="spacer"></div><button class="key" id="key" title="Set OpenRouter key">🔑</button><button class="new" id="new">＋ New chat</button></header><main id="chat" class="chat"><section id="welcome" class="welcome"><div class="orb">A</div><h1>What can I help you with?</h1><p>Chat with Aither AI using a hosted AI model.</p><div class="chips"><button data-p="Tell me a fun fact">💡 Fun fact</button><button data-p="Tell me a joke">😂 Tell me a joke</button><button data-p="Give me a coding idea">💻 Coding idea</button><button data-p="Help me brainstorm something">✨ Brainstorm</button></div></section></main><form id="form" class="composer"><div class="box"><textarea id="input" rows="1" placeholder="Message Aither AI..."></textarea><button class="send" type="submit">➤</button></div><div class="hint">Aither AI • Hosted by OpenRouter</div></form></div><script>const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),welcome=$('welcome'),form=$('form');let messages=[];const MODEL='openrouter/free';function key(){return sessionStorage.getItem('aither_key')||''}function add(role,text){const r=document.createElement('div');r.className='msg '+role;r.innerHTML='<div class="avatar">'+(role==='user'?'🙂':'A')+'</div><div class="message-wrap"><div class="sender">'+(role==='user'?'You':'Aither AI')+'</div><div class="bubble"></div></div>';r.querySelector('.bubble').textContent=text;chat.append(r);chat.scrollTop=chat.scrollHeight}function askKey(){const k=prompt('Paste your OpenRouter API key. It is stored only in this browser session.');if(k&&k.trim()){sessionStorage.setItem('aither_key',k.trim());return k.trim()}return ''}async function send(text){if(!text.trim())return;let k=key()||askKey();if(!k)return;welcome.style.display='none';add('user',text);messages.push({role:'user',content:text});input.value='';input.style.height='auto';const load=document.createElement('div');load.className='msg assistant';load.innerHTML='<div class="avatar">A</div><div class="message-wrap"><div class="sender">Aither AI</div><div class="bubble">Thinking…</div></div>';chat.append(load);chat.scrollTop=chat.scrollHeight;try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+k,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'Aither AI'},body:JSON.stringify({model:MODEL,messages:[{role:'system',content:'You are Aither AI, a helpful conversational AI assistant.'},...messages]})});const data=await res.json();if(!res.ok)throw Error(data?.error?.message||'AI request failed');const reply=data?.choices?.[0]?.message?.content||'No response.';load.remove();add('assistant',reply);messages.push({role:'assistant',content:reply})}catch(e){load.remove();add('assistant','⚠️ '+e.message)}}form.onsubmit=e=>{e.preventDefault();send(input.value)};input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};$('key').onclick=askKey;$('new').onclick=()=>{messages=[];chat.innerHTML='';chat.append(welcome);welcome.style.display='block';input.focus()};document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>send(b.dataset.p));input.focus();</script></body></html>
