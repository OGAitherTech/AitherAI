<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="Aither AI — a real hosted AI chat assistant.">
  <title>Aither AI 🤖</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="side-top"><button id="closeSidebar" class="icon mobile-only">✕</button><div class="side-brand"><div class="logo">A</div><b>Aither AI</b></div><button id="newChatSide" class="new-chat">＋ New chat</button></div>
      <div class="history-label">RECENT CHATS</div><div id="history" class="history"></div>
      <div class="side-bottom"><span>🤖 Hosted AI</span><small>OpenRouter • GitHub Pages</small></div>
    </aside>
    <div class="shell">
      <header>
        <button id="menu" class="icon mobile-only" aria-label="Open chats">☰</button>
        <div class="brand"><div class="logo">A</div><div><b>Aither AI</b><span><i></i> Hosted AI</span></div></div>
        <div class="actions"><button id="keyButton" class="icon" title="Connect OpenRouter key">🔑</button><button id="theme" class="icon" title="Toggle theme">☀️</button><button id="clear" class="icon" title="New chat">＋</button></div>
      </header>
      <main id="chat" aria-live="polite"></main>
      <section id="welcome">
        <div class="orb">A</div><h1>What can I help you with?</h1><p>Ask Aither anything. Start a real AI conversation.</p>
        <div class="chips"><button data-prompt="Explain something cool">🧠 Explain something</button><button data-prompt="Give me a random challenge">🎮 Challenge me</button><button data-prompt="Tell me a joke">😂 Tell me a joke</button><button data-prompt="Help me brainstorm a project">💡 Brainstorm</button></div>
      </section>
      <form id="composer"><div class="composer-box"><textarea id="input" rows="1" autocomplete="off" placeholder="Message Aither AI..." aria-label="Message Aither AI"></textarea><div class="composer-actions"><button type="button" id="mic" class="icon" title="Voice input">🎤</button><button type="submit" class="send" title="Send" aria-label="Send">➤</button></div></div></form>
      <div class="composer-note">Aither uses OpenRouter directly from this GitHub Pages app. API keys are never stored in the repository.</div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
