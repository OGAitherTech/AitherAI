<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aither AI</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#080a10;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center}.card{width:min(760px,calc(100% - 40px));padding:42px;border:1px solid #2c3040;border-radius:28px;background:linear-gradient(145deg,#121620,#0d1017);box-shadow:0 30px 100px #0008}.logo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:30px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#22d3ee);box-shadow:0 0 50px #7655ff55}h1{font-size:36px;margin:22px 0 8px}p{color:#969eaf;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}a,button{border:0;border-radius:13px;padding:12px 16px;font-weight:800;text-decoration:none;cursor:pointer}a{background:#fff;color:#111}button{background:#222735;color:#fff}small{display:block;color:#687183;margin-top:25px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">A</div>
    <h1>Aither AI</h1>
    <p>The Aither AI desktop app is ready. It uses the same browser-based AI experience as the GitHub Pages version, with the AI model running on your device through WebGPU.</p>
    <div class="actions">
      <a href="https://ogaithertech.github.io/AitherAI/">Open Aither AI</a>
      <button onclick="location.reload()">Reload</button>
    </div>
    <small id="info">Desktop • Aither AI 4.1.0</small>
  </main>
  <script>if(window.aitherDesktop)document.getElementById('info').textContent='Desktop • '+window.aitherDesktop.platform+' • Aither AI 4.1.0';</script>
</body>
</html>
